# Runs as the unprivileged nginx user: port 8080, pid and temp files in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's embedded DNS; resolving per request lets nginx start before (or without) the api.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 3s;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Same origin as the site, so the API needs no CORS.
    location /api/v1/ {
      set $api_upstream http://api:8000;
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output: cache for a year.
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri =404;
    }

    # SPA fallback; index.html is always revalidated.
    location / {
      add_header Cache-Control "no-cache" always;
      include /etc/nginx/security-headers.conf;
      try_files $uri $uri/ /index.html;
    }
  }
}
