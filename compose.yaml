# Bonfire Ledger — local stack.
# Dev:  docker compose up --watch                       (web on http://localhost:5173)
# Prod: docker compose --profile prod up --build web-prod  (nginx on http://localhost:8080)
# api/ and seed services are added once api/ exists.

name: bonfire-ledger

services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    environment: # values come from .env; no credentials in this file
      - MONGO_INITDB_ROOT_USERNAME
      - MONGO_INITDB_ROOT_PASSWORD
      - MONGO_INITDB_DATABASE
    ports:
      - "27017:27017" # dev only: lets Compass connect
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./web
      target: dev
    environment:
      VITE_API_MODE: ${VITE_API_MODE:-mock}
      VITE_API_HTTP: ${VITE_API_HTTP:-}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
      VITE_IMAGE_BASE_URL: ${VITE_IMAGE_BASE_URL:-/images}
      # Read by mockApi (web/scripts/data-paths.ts).
      DATA_DIR: /data
      FIXTURES_DIR: /fixtures
    ports:
      - "5173:5173"
    volumes:
      # Card data store, read-only. Outside the repo until its final home is decided.
      - ${DSTBG_DATA_DIR:-../DSTBG_DATA}:/data:ro
      # Phase 1 fixtures (classes, sample encounters), shared with the backend seed.
      - ./data/fixtures:/fixtures:ro
    # Compose Watch instead of bind-mounting the source: bind mounts on Windows
    # don't trigger file events in the container, so HMR would miss changes.
    develop:
      watch:
        - action: sync
          path: ./web/src
          target: /app/src
        - action: sync
          path: ./web/index.html
          target: /app/index.html
        - action: sync+restart
          path: ./web/vite.config.ts
          target: /app/vite.config.ts
        - action: sync+restart
          path: ./web/tsconfig.json
          target: /app/tsconfig.json
        - action: sync+restart
          path: ./web/scripts
          target: /app/scripts
        - action: rebuild
          path: ./web/package.json
        - action: rebuild
          path: ./web/package-lock.json

  # Production image: static build served by nginx, which proxies /api/v1 to api:8000.
  web-prod:
    profiles: [prod]
    build:
      context: ./web
      target: runtime
      args:
        VITE_API_MODE: ${VITE_API_MODE:-mock}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_IMAGE_BASE_URL: ${VITE_IMAGE_BASE_URL:-/images}
    ports:
      - "8080:8080"
    volumes:
      # nginx serves /images from the store's images/ folder.
      - ${DSTBG_DATA_DIR:-../DSTBG_DATA}:/data:ro

  # api:   build ./api  — FastAPI + uv (owner)
  # seed:  one-off import job using the api image (owner)

volumes:
  mongo-data:
