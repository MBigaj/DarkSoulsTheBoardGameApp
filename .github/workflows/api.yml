name: api

# No trigger-level path filters: the workflow runs on every PR, so the required
# `api-ok` check always reports. The `changes` job decides whether there is work to do.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  # Cancel superseded PR runs only; every commit on main keeps its run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: api

env:
  # Fail when uv.lock is out of date with pyproject.toml instead of silently re-locking.
  UV_LOCKED: '1'
  FORCE_COLOR: '1'

jobs:
  changes:
    name: Detect API changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      api: ${{ steps.filter.outputs.api }}
    steps:
      # Push events diff against the previous commit, which needs the repository.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request'
        with:
          persist-credentials: false
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            api:
              - 'api/**'
              - '.github/workflows/api.yml'

  check:
    name: Lint, typecheck, unit tests
    needs: changes
    # Manual runs always do the work.
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Third-party actions pinned to a full commit SHA (tags can be moved); the comment
      # keeps the version readable for updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8' # same uv as api/Dockerfile
          working-directory: api
          enable-cache: true
          cache-python: true # Python comes from api/.python-version, installed by uv

      - run: uv sync

      - name: Format
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check --output-format=github .
      - name: Typecheck
        run: uv run mypy
      - name: Unit tests
        run: uv run pytest tests/unit

  integration:
    # A real MongoDB: repository tests never mock the driver.
    name: API and integration tests
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongo:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # No auth: a throwaway server that exists only for this job, so no credentials
      # are needed anywhere.
      API_MONGO_HOST: localhost
      API_MONGO_DB: bonfire_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.8'
          working-directory: api
          enable-cache: true
          cache-python: true

      - run: uv sync

      - name: API and integration tests
        run: uv run pytest tests/api tests/integration

  # The one check to mark as required in branch protection. It always runs and
  # reports, so PRs that don't touch api/ aren't left waiting for skipped jobs.
  api-ok:
    name: api-ok
    if: always()
    needs: [changes, check, integration]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail if a needed job failed or was cancelled
        working-directory: .
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          case " $RESULTS " in
            *" failure "*|*" cancelled "*) exit 1 ;;
          esac
